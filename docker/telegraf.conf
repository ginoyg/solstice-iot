[agent]
  interval = "10s"
  flush_interval = "10s"
  omit_hostname = true

# 1. Lighting ON/OFF events

[[inputs.mqtt_consumer]]
  servers = ["tcp://${MQTT_HOST}:1883"]
  topics = ["home/solstice/events"]
  username = "${MQTT_USER}"
  password = "${MQTT_PASSWORD}"
  client_id = "solstice-telegraf-events"
  qos = 0
  data_format = "json_v2"

  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "solstice_events"
    timestamp_path = "timestamp"
    timestamp_format = "unix"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "state"
      type = "string"
      optional = true

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "sequence"
      type = "int"
      optional = true

    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "source"
      optional = true


# 2. Brightness and color temperature adjustments

[[inputs.mqtt_consumer]]
  servers = ["tcp://${MQTT_HOST}:1883"]
  topics = ["home/solstice/adjustments"]
  username = "${MQTT_USER}"
  password = "${MQTT_PASSWORD}"
  client_id = "solstice-telegraf-adjustments"
  qos = 0
  data_format = "json_v2"

  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "solstice_adjustments"
    timestamp_path = "timestamp"
    timestamp_format = "unix"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "previous"
      type = "int"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "value"
      type = "int"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "sequence"
      type = "int"
      optional = true

    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "type"

    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "source"
      optional = true


# 3. ESP32 health telemetry

[[inputs.mqtt_consumer]]
  servers = ["tcp://${MQTT_HOST}:1883"]
  topics = ["home/solstice/telemetry"]
  username = "${MQTT_USER}"
  password = "${MQTT_PASSWORD}"
  client_id = "solstice-telegraf-health"
  qos = 0
  data_format = "json_v2"

  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "solstice_health"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "uptime_seconds"
      type = "int"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "wifi_rssi_dbm"
      type = "int"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "free_heap_bytes"
      type = "int"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "mqtt_connected"
      type = "bool"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "brightness"
      type = "int"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "kelvin"
      type = "int"

    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "firmware"
      optional = true
    
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "power"
      type = "string"


# Write parsed measurements to InfluxDB 2.x

[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "${TELEGRAF_INFLUX_TOKEN}"
  organization = "solstice"
  bucket = "solstice"
